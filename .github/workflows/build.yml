name: Build ElfProtect

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "29.0.14206865"
      # Amice obfuscation passes
      # NOTE: obfusheader.h produces non-standard IR (computed gotos, shuffled
      # arrays) that breaks many amice passes. Only safe passes are enabled.
      AMICE_INDIRECT_CALL: "true"
      AMICE_MBA: "true"
      AMICE_LOWER_SWITCH: "true"
      AMICE_DELAY_OFFSET_LOADING: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake 4.0+
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.0.0"

      - name: Verify NDK r29
        run: |
          NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK_HOME" ]; then
            echo "NDK ${NDK_VERSION} not found, installing..."
            yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK_VERSION}"
          fi
          echo "NDK_HOME=${NDK_HOME}" >> "$GITHUB_ENV"

      - name: Setup unstripped NDK Clang (provides libLLVM.so)
        id: ndk-clang
        uses: Ylarod/setup-ndk-clang@v1
        with:
          ndk-version: r29

      - name: Setup LLVM library path
        run: |
          LLVM_HOME="${{ steps.ndk-clang.outputs.clang-path }}"

          if [ -d "${LLVM_HOME}/lib64" ]; then
            LIBDIR="${LLVM_HOME}/lib64"
          else
            LIBDIR="${LLVM_HOME}/lib"
          fi

          # Create libLLVM.so symlink if only versioned name exists
          if [ ! -e "${LIBDIR}/libLLVM.so" ]; then
            CANDIDATE=$(ls "${LIBDIR}"/libLLVM*.so* 2>/dev/null | head -n 1 || true)
            if [ -n "$CANDIDATE" ]; then
              ln -s "$CANDIDATE" "${LIBDIR}/libLLVM.so" || true
            fi
          fi

          echo "LD_LIBRARY_PATH=${LIBDIR}" >> "$GITHUB_ENV"
          echo "LLVM library path: ${LIBDIR}"
          ls -la "${LIBDIR}"/libLLVM* || true

      - name: Download amice obfuscation plugin
        env:
          GH_TOKEN: ${{ secrets.AMICE_TOKEN }}
        run: |
          ARTIFACT_NAME="libamice-linux-x64-android-ndk-r29"

          ARTIFACT_ID=$(gh api "repos/fuqiuluo/amice/actions/artifacts?name=${ARTIFACT_NAME}&per_page=1" \
            --jq '.artifacts[0] | select(.expired == false) | .id')

          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::No valid artifact '${ARTIFACT_NAME}' found in fuqiuluo/amice"
            exit 1
          fi

          echo "Downloading artifact ${ARTIFACT_ID}..."
          mkdir -p amice
          gh api "repos/fuqiuluo/amice/actions/artifacts/${ARTIFACT_ID}/zip" > amice/artifact.zip
          cd amice && unzip artifact.zip && rm artifact.zip

          if [ ! -f libamice.so ]; then
            echo "::error::libamice.so not found after extraction"
            ls -la
            exit 1
          fi

          echo "AMICE_PLUGIN=${GITHUB_WORKSPACE}/amice/libamice.so" >> "$GITHUB_ENV"
          echo "Downloaded libamice.so ($(stat -c%s libamice.so) bytes)"

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_ANDROID_NDK="${NDK_HOME}" \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_CXX_FLAGS="-fpass-plugin=${AMICE_PLUGIN}" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --verbose

      - name: Bundle matching loader and packer
        run: |
          mkdir -p build/bundle
          cp build/ElfProtect build/libElfProtect.so pack.py payload_format.py build/bundle/

      - name: Upload ElfProtect
        uses: actions/upload-artifact@v4
        with:
          name: ElfProtect-arm64-v8a
          path: build/bundle/
          retention-days: 90
          if-no-files-found: error

  release:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-latest
      cancel-in-progress: false

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ElfProtect-arm64-v8a
          path: bundle/

      - name: Package release archive
        run: |
          # Artifact downloads reset file permissions; restore the loader modes.
          chmod 755 bundle/ElfProtect bundle/libElfProtect.so
          tar -czf ElfProtect-arm64-v8a.tar.gz -C bundle .

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A slower build must not replace the artifacts of a newer commit.
          BRANCH_SHA=$(gh api "repos/${GH_REPO}/git/ref/${GITHUB_REF#refs/}" --jq '.object.sha')
          if [ "$BRANCH_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping release: ${GITHUB_SHA} is no longer the branch head."
            exit 0
          fi

          cat > release-notes.md <<EOF
          Automated Android arm64-v8a build from commit ${GITHUB_SHA}.

          Includes ElfProtect, libElfProtect.so, pack.py, and payload_format.py.
          Use the loaders and Python scripts from the same archive.

          Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          # Updating a release's target alone does not move an existing tag.
          if gh api "repos/${GH_REPO}/git/ref/tags/latest" --silent 2>/dev/null; then
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true --silent
          else
            gh api --method POST "repos/${GH_REPO}/git/refs" \
              -f ref=refs/tags/latest -f sha="$GITHUB_SHA" --silent
          fi

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ElfProtect-arm64-v8a.tar.gz --clobber
            gh release edit latest --title "Latest build" \
              --notes-file release-notes.md --latest
          else
            gh release create latest ElfProtect-arm64-v8a.tar.gz \
              --verify-tag --title "Latest build" \
              --notes-file release-notes.md --latest
          fi
